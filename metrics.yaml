# =========================================================================
# ALETHEIA19 - METRICS & SCALING SPECIFICATION (metrics.yaml) — V2.0
# =========================================================================
# Format: YAML 1.2
# Standard: FASCIA Qualitative 0-10 Diagnostic Framework
# =========================================================================

metrology_rules:
  score_r:
    name: "Soil Grounding Ratio / Indice d'Ancrage au Sol"
    symbol: "R"
    operational_definition:
      description: "Ratio of empirical First-Hand observations (Sol) to administrative/symbolic assertions (Codex)."
      formula: "R = Sol_Tokens / (Sol_Tokens + Codex_Tokens)"
    bounds:
      grounded: "R >= 0.70" # High empirical grounding (7/10)
      vigilance: "0.35 < R < 0.70" # Moderate desynchronization
      chimera: "R <= 0.35" # System is a pure simulation (3/10 or below)

  loi_tau:
    name: "Multi-Layer Error Reduction"
    definition: "Multiplicative reduction of error rates across independent physical detection layers."
    formula: "P(Error_Global) = Product(P(Error_i)) for i in range(1, N)"

  single_lock:
    name: "Single Lock Trigger"
    definition: "A single critical diagnostic score >= 9/10 triggers a direct audit veto, bypassing global averages."
    target_diagnostics:
      - "D3_Neutralized_Immune_Response"
      - "D7_Hollow_Consensus"

  cistercian_decoupling_index:
    name: "Cistercian Decoupling & Friction Index"
    symbol: "chi"
    associated_diagnostic: "D6_Inverted_Fallow"
    definition: "Operational friction index measuring coordination overhead vs local execution autonomy (scale 0.0 to 1.0)."
    bounds:
      sovereign_decentralized: "chi <= 0.20" # High local autonomy
      administrative_creep: "0.20 < chi < 0.60" # Rising coordination lag
      cognitive_capture: "chi >= 0.60" # Local nodes lose execution state

  semantic_oxygen_ratio:
    name: "Semantic Oxygen Ratio / Asphyxiation Index"
    symbol: "omega"
    associated_diagnostic: "D5_Semantic_Oxygen_Debt"
    definition: "Ratio of unconstrained operational terms to total vocabulary describing crisis/failure states (scale 0.0 to 1.0)."
    bounds:
      oxygenated: "omega >= 0.80" # Uncensored crisis reporting
      hypoxia: "0.50 < omega < 0.80" # Active suppression of warnings
      asphyxiation: "omega <= 0.50" # Severe censorship

  temporal_asymmetry_index:
    name: "Temporal Asymmetry Index / Indice de Dissymétrie Temporelle"
    symbol: "D_t"
    associated_diagnostic: "D4_Temporal_Extraction"
    definition: "Quantifies the divergence rate between symbolic model revision and physical substrate validation (scale 0.0 to 1.0)."
    bounds:
      synchronized: "D_t < 0.30" # Ideal tracking between model and physical ground
      coupled_tracking: "0.30 <= D_t < 0.70" # Substrate adapts with growing lag
      chaotic_desynchronization: "D_t >= 0.70" # Model revisions outrun physical testing (7/10 threshold)

inference_rules:
  R001_asphyxia_regime:
    name: "Transition to Asphyxiation Regime"
    condition: "D5_Semantic_Oxygen_Debt >= 8/10 AND D6_Inverted_Fallow >= 7/10"
    consequence: "Systemic hypoxia triggered. Critical operational signals are masked."

  R002_chimera_collapse:
    name: "Transition to Chimera Collapse"
    condition: "score_r <= 0.35 AND D1_Facade_Homeostasis >= 8/10"
    consequence: "Autophagous semantic loop active. Sol grounding is lost. Trigger direct audit veto."

  R003_immune_neutralization:
    name: "Neutralization Veto Trigger"
    condition: "D3_Neutralized_Immune_Response >= 9/10 OR D7_Hollow_Consensus >= 9/10"
    consequence: "Immune warning vectors disabled. Executing direct veto protocol."